<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="1080p Full HD Video Downloader for TikTok, YouTube, Instagram & Facebook" />
  <title>Chenuvidz — 1080p Downloader</title>
  
<link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #050505;
      --bg-surface-glass: rgba(255, 255, 255, 0.06);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --border-specular: rgba(255, 255, 255, 0.32);
      --text-primary: #FFFFFF;
      --text-secondary: #A3A3A3;
      --semantic-error: #FF4D4D;
      --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 9999px;
      --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-stack);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.22), rgba(255,255,255,0.02) 70%);
      filter: blur(30px);
      animation: floatOrb 14s infinite alternate ease-in-out;
    }

    .orb-1 { width: 300px; height: 300px; top: -80px; left: -60px; }
    .orb-2 { width: 260px; height: 260px; bottom: 5%; right: -70px; animation-delay: -5s; }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(30px, -40px, 40px) scale(1.12); }
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      padding: 20px 16px 32px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--bg-surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--glass-shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 12px #FFFFFF;
    }

    .mode-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .hero-section {
      text-align: center;
      padding: 12px 0 4px;
    }

    .cube-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      transform-style: preserve-3d;
      animation: spin3D 12s infinite linear;
      position: relative;
    }

    .cube-ring {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 18px;
    }

    .cube-ring:nth-child(1) { transform: rotateX(45deg) rotateY(45deg); }
    .cube-ring:nth-child(2) { transform: rotateX(-45deg) rotateY(45deg); border-color: rgba(255,255,255,0.4); }
    .cube-ring:nth-child(3) { transform: rotateZ(45deg); border-radius: 50%; }

    @keyframes spin3D {
      0% { transform: rotateX(0) rotateY(0); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #FFFFFF 0%, #8E8E93 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hero-sub {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
    }

    .glass-card {
      background: var(--bg-surface-glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      border-top-color: var(--border-specular);
      box-shadow: var(--glass-shadow);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px 6px 4px 14px;
    }

    .platform-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      margin-right: 8px;
      text-transform: uppercase;
    }

    .url-input {
      width: 100%;
      height: 48px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }

    .url-input::placeholder { color: #666666; }

    .paste-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .pills-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .quality-pill {
      height: 46px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quality-pill.active {
      background: #FFFFFF;
      color: #050505;
      border-color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
    }

    .download-cta {
      height: 56px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(180deg, #FFFFFF 0%, #DCDCDC 100%);
      color: #050505;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 0 #888888, 0 16px 30px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .download-cta:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #888888;
    }

    .status-box {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
    }

    .status-box.visible { display: flex; }

    .direct-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 14px;
      border-radius: 14px;
      background: #FFFFFF;
      color: #050505;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 4px 15px rgba(255,255,255,0.3);
      margin-top: 4px;
    }

    .platforms-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .plat-badge {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="ambient-stage">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>CHENUVIDZ</span>
      </div>
      <span class="mode-badge">1080P VERIFIED</span>
    </header>

    <section class="hero-section">
      <div class="cube-wrap">
        <div class="cube-ring"></div>
        <div class="cube-ring"></div>
        <div class="cube-ring"></div>
      </div>
      <h1 class="hero-title">CHENUVIDZ</h1>
      <p class="hero-sub">Bachinsky 3D • Liquid Glass • 1080p HD</p>
    </section>

    <section class="glass-card">
      <div class="input-group">
        <span class="platform-tag" id="platformBadge">AUTO</span>
        <input
          type="url"
          id="videoUrl"
          class="url-input"
          placeholder="Paste TikTok, YT, IG, or FB link..."
          autocomplete="off"
        />
        <button type="button" class="paste-btn" id="pasteBtn">📋 Paste</button>
      </div>

      <div class="pills-row">
        <button type="button" class="quality-pill active" data-quality="1080">✦ 1080p HD</button>
        <button type="button" class="quality-pill" data-quality="720">720p Fast</button>
        <button type="button" class="quality-pill" data-quality="audio">♪ MP3 Audio</button>
      </div>

      <button type="button" class="download-cta" id="downloadBtn">
        <span id="btnText">⚡ GENERATE 1080P DOWNLOAD</span>
      </button>

      <div class="status-box" id="statusBox">
        <div id="statusMessage" style="font-weight: 600;">Ready</div>
        <a id="directSaveBtn" class="direct-btn" href="#" target="_blank">⬇ TAP HERE TO DOWNLOAD VIDEO</a>
      </div>
    </section>

    <footer class="platforms-bar">
      <span class="plat-badge">YouTube 1080p</span>
      <span class="plat-badge">TikTok No-WM</span>
      <span class="plat-badge">Instagram Reels</span>
      <span class="plat-badge">Facebook HD</span>
    </footer>
  </main>

  <script>
    // Register Service Worker for PWABuilder Offline & PWA requirements
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript;charset=utf-8,' + encodeURIComponent(`
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `)).catch(() => {});
      });
    }

    const videoUrlInput = document.getElementById('videoUrl');
    const platformBadge = document.getElementById('platformBadge');
    const pasteBtn = document.getElementById('pasteBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const btnText = document.getElementById('btnText');
    const statusBox = document.getElementById('statusBox');
    const statusMessage = document.getElementById('statusMessage');
    const directSaveBtn = document.getElementById('directSaveBtn');

    let selectedQuality = '1080';

    function detectPlatform(url) {
      const u = url.toLowerCase();
      if (u.includes('tiktok.com')) return 'TIKTOK';
      if (u.includes('youtube.com') || u.includes('youtu.be')) return 'YOUTUBE';
      if (u.includes('instagram.com')) return 'INSTA';
      if (u.includes('facebook.com') || u.includes('fb.watch') || u.includes('fb.com')) return 'FB';
      return 'VIDEO';
    }

    videoUrlInput.addEventListener('input', () => {
      platformBadge.textContent = detectPlatform(videoUrlInput.value);
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          videoUrlInput.value = text.trim();
          platformBadge.textContent = detectPlatform(text);
        }
      } catch (err) {
        videoUrlInput.focus();
      }
    });

    document.querySelectorAll('.quality-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.quality-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedQuality = pill.dataset.quality;
        btnText.textContent = selectedQuality === 'audio' ? '⚡ GENERATE MP3 AUDIO' : `⚡ GENERATE ${selectedQuality}P DOWNLOAD`;
      });
    });

    downloadBtn.addEventListener('click', () => {
      const url = videoUrlInput.value.trim();
      const plat = detectPlatform(url);

      if (!url || !url.startsWith('http')) {
        statusBox.classList.add('visible');
        statusMessage.style.color = '#FF4D4D';
        statusMessage.textContent = '! Please paste a valid video link first.';
        return;
      }

      statusBox.classList.add('visible');
      statusMessage.style.color = '#FFFFFF';
      statusMessage.textContent = `✓ 1080p Link Generated Successfully!`;

      const formatType = selectedQuality === 'audio' ? 'mp3' : '1080';
      const secureDownloadUrl = `https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=${formatType}`;

      directSaveBtn.href = secureDownloadUrl;
      window.open(secureDownloadUrl, '_blank');
    });
  </script>
</body>
</html>
